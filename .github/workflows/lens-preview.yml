# ──────────────────────────────────────────────────────────────────────
# Lens preview — lint and test tools/lens-preview on its own.
#
# The preview is its own Cargo workspace and this is its own workflow,
# so a broken preview fails here without blocking vettd-cli's CI or
# release. It runs only when the preview (or this file) changes.
# Actions are pinned to the same SHAs as ci.yml.
# ──────────────────────────────────────────────────────────────────────

name: Lens preview

on:
    pull_request:
        paths:
            - 'tools/lens-preview/**'
            - '.github/workflows/lens-preview.yml'
    push:
        branches: [main]
        paths:
            - 'tools/lens-preview/**'
            - '.github/workflows/lens-preview.yml'

concurrency:
    group: lens-preview-${{ github.event_name == 'push' && github.run_id || github.head_ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        name: Lens preview lint & test
        runs-on: blacksmith-2vcpu-ubuntu-2204
        defaults:
            run:
                working-directory: tools/lens-preview
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
              with:
                  components: clippy, rustfmt

            # The repo's rust-toolchain.toml applies here too.
            - name: Ensure toolchain components
              run: rustup component add clippy rustfmt

            - name: Cache Cargo
              uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
              with:
                  workspaces: tools/lens-preview

            - name: Formatting
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --locked --all-targets -- -D warnings

            - name: Test
              run: cargo test --locked
