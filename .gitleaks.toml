title = "vettd gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Intentional GitHub PAT fixture used in source-analysis tests"
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/source_analysis\.rs$''',
]
regexTarget = "line"
regexes = [
  '''"github_token": "ghp_[A-Za-z0-9]{36}",''',
]

[[allowlists]]
description = "Intentional private-key detector literals in content pattern definitions"
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/content_patterns\.rs$''',
]
regexTarget = "line"
regexes = [
  '''expression: r"-----BEGIN (?:RSA|EC|DSA|OPENSSH)? ?PRIVATE KEY-----",''',
]

[[allowlists]]
description = "Intentional JWT fixture used in content-pattern tests"
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/content_patterns\.rs$''',
]
regexTarget = "line"
regexes = [
  '''let jwt = "eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTYifQ\.c2lnbmF0dXJlMTIzNDU2Nzg5MA";''',
]

[[allowlists]]
description = "Intentional redaction-test fixtures: secret-shaped MCP command-arg literals in contract::mcp tests"
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/contract/mcp\.rs$''',
]
regexTarget = "line"
regexes = [
  '''sk-live-ABC123''',
  '''sk-live-ABC["']''',
  '''ghp_abc123xyz''',
  '''ghp_xxxxxxxxxxxxxxxxxxxx''',
  '''ghp_xxxxxxxxxxxx''',
  '''ghp_SECRETTOKEN''',
  '''akia-1234567890''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
  '''s3cret!''',
]

[[allowlists]]
description = "Intentional redaction-test fixture: pinned API key in contract::skills MCP-skill description test"
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/contract/skills\.rs$''',
]
regexTarget = "line"
regexes = [
  '''sk-live-ABC123''',
]

[[allowlists]]
description = """
Invented passive-observer fixture session id. It is the stem of the committed fixture transcript
crates/vettd-cli/tests/fixtures/observe/claude_home/projects/-fixture-project/, so tests assert
against it verbatim; gitleaks' generic-api-key rule reads `assert_eq!(x, "<uuid>")` as an
assignment and the v4-shaped hex scores entropy 4.02. Nothing about this value is secret — a real
harness session id never leaves the machine, it is HMAC'd into run_id (see observe/envelope.rs).
Pinned to this one literal so any other high-entropy string in these files still fails.
"""
condition = "AND"
paths = [
  '''(^|/)crates/(proov|vettd-cli)/src/observe/.*\.rs$''',
  '''(^|/)crates/(proov|vettd-cli)/tests/observe_integration\.rs$''',
]
regexTarget = "line"
regexes = [
  '''0f1e2d3c-4b5a-6978-8a9b-0c1d2e3f4a5b''',
]
