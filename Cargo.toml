[workspace]
resolver = "2"
members = [
    "crates/vettd-cli",
]
exclude = []

[workspace.package]
version = "0.9.3"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
